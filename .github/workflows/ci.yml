name: CI

on:
  pull_request:
  push:
    branches: [main, native-migration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-android:
    name: Shared core tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Design tokens are in sync
        run: |
          python3 design/generate_tokens.py
          git diff --exit-code -- iosApp/LunchApp/DesignSystem/Tokens.swift androidApp/src/main/kotlin/au/iapp/lunch/ui/theme/Tokens.kt
      - name: No literal colours outside the token files
        run: design/check_no_literal_colours.sh
      - name: Shared core tests (JVM and Android)
        run: ./gradlew :shared:desktopTest :shared:testDebugUnitTest --no-daemon
      - name: Android app assembles
        run: ./gradlew :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-reports
          path: shared/build/reports/tests

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"
      - name: Build LunchCore framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build the app
        run: |
          xcodebuild -project iosApp/LunchApp.xcodeproj -scheme LunchApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check, format, test
        working-directory: backend
        run: make check && make test
