name: CI

on:
  pull_request:
  push:
    branches: [main, native-migration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-android:
    name: Shared core tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared restaurant chain catalogue is in sync
        run: python3 shared/scripts/generate_chain_catalog.py --check
      - name: Design tokens are in sync
        run: |
          python3 design/generate_tokens.py
          git diff --exit-code -- iosApp/LunchApp/DesignSystem/Tokens.swift androidApp/src/main/kotlin/au/iapp/lunch/ui/theme/Tokens.kt
      - name: No literal colours outside the token files
        run: design/check_no_literal_colours.sh
      - name: Shared core tests (JVM and Android)
        run: ./gradlew :shared:desktopTest :shared:testDebugUnitTest --no-daemon
      - name: Android app assembles and unit tests pass
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-reports
          path: shared/build/reports/tests

  ios:
    name: iOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        # Use the newest Xcode on the image. RevenueCat's purchases-ios must match the
        # Swift version: 5.67.1 and earlier do not compile under Swift 6.4 (Xcode 27).
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build LunchCore framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Release configuration security checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s iosApp/scripts -p 'test_*.py'
      - name: Build and test the app
        run: |
          set -o pipefail
          # Simulator names change with every Xcode release, so resolve one at run time.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for v in sorted(ds) for d in ds[v] if "iPhone" in d["name"]))')
          echo "Testing on simulator $UDID"
          xcodebuild -project iosApp/LunchApp.xcodeproj -scheme LunchApp \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug test CODE_SIGNING_ALLOWED=NO | xcpretty

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check, format, test
        working-directory: backend
        run: make check && make test
      - name: Web invitation workflow (fictional data)
        run: node backend/tests/web_invite_test.mjs
      - name: PostgreSQL billing, invitations, concurrency and RLS regression tests
        run: |
          docker run --detach --name lunch-review-postgres-ci --env POSTGRES_PASSWORD=ci-fixture-only --tmpfs /var/lib/postgresql/data postgres:17-alpine
          for attempt in $(seq 1 30); do
            docker exec lunch-review-postgres-ci pg_isready -U postgres && break
            sleep 1
          done
          python3 backend/tests/invitation_regression.py lunch-review-postgres-ci
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force lunch-review-postgres-ci || true
