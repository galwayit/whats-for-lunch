appId: au.iapp.guess_what.what_we_have_for_lunch
name: ai_gate_and_paywall
tags: [monetization]
---
- launchApp
- tapOn:
    id: "hero_hungry_button"
- extendedWaitUntil:
    visible:
      id: "recommendation_card"
    timeout: 15000
- tapOn: "Show me more"
- assertVisible: "AI recommendations"
- tapOn:
    id: "craving_field"
- inputText: "something light"
- tapOn: "Ask"
- extendedWaitUntil:
    visible:
      id: "ai_result_0"
    timeout: 20000
# Second request of the day hits the free gate
- tapOn: "Ask"
- assertVisible: "You've used today's free AI pick"
- tapOn: "See Lunch Pro"
- assertVisible: "Lunch Pro"
- assertVisible: "Host group lunches"
- assertVisible: "Restore purchases"
- assertVisible: "Terms of Use"
- assertVisible: "Privacy Policy"
