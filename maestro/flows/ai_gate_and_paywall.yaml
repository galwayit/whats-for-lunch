appId: au.iapp.lunch
name: ai_gate_and_paywall
tags: [monetization]
---
- launchApp
- tapOn:
    id: "hero_hungry_button"
- extendedWaitUntil:
    visible:
      id: "recommendation_card"
    timeout: 15000
- tapOn: "Show me more"
- assertVisible: "AI recommendations"
- tapOn:
    id: "craving_field"
- inputText: "something light"
- tapOn: "Ask"
- assertVisible:
    id: "ai_consent_card"
- tapOn:
    id: "ai_consent_agree"
- extendedWaitUntil:
    visible:
      id: "ai_result_0"
    timeout: 20000
# After the one free request, another attempt opens the subscription paywall.
- tapOn: "Ask"
- assertVisible: "Lunch Pro"
- assertVisible: "Host group lunches"
- assertVisible: "Restore purchases"
- assertVisible: "Terms of Use"
- assertVisible: "Privacy Policy"
