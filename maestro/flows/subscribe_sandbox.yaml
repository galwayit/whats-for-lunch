appId: au.iapp.guess_what.what_we_have_for_lunch
name: subscribe_sandbox
tags: [monetization, sandbox]
# Requires a sandbox tester signed in on the device (iOS) or a licence tester (Android).
---
- launchApp
- tapOn: "Profile"
- tapOn: "Lunch Pro"
- assertVisible: "per year"
- tapOn:
    id: "paywall_cta"
- extendedWaitUntil:
    visible: "You're on Lunch Pro"
    timeout: 60000
- tapOn: "Done"
- tapOn: "Profile"
- assertVisible: "Lunch Pro · Yearly"
